<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile UI Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101820; color: #f5ead1; font-family: system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; padding: 10px 16px; background: #18232d; border-bottom: 1px solid #4f5d67; }
    header strong { display: block; font-size: 14px; }
    header small { color: #bfc8cd; }
    main { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    section { flex: 0 0 auto; }
    h2 { margin: 0 0 8px; font-size: 13px; text-align: center; }
    iframe { display: block; height: 844px; border: 1px solid #8b774d; border-radius: 14px; background: white; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    .narrow iframe { width: 390px; }
    .wide iframe { width: 430px; }
  </style>
</head>
<body>
  <header><strong>スマートフォンUI確認</strong><small>390px・430pxの順に表示します。同じ検証用セーブを共有します。</small></header>
  <main>
    <section class="narrow"><h2>390 × 844</h2><iframe src="../index.html" title="390px preview"></iframe></section>
    <section class="wide"><h2>430 × 844</h2><iframe src="../index.html" title="430px preview"></iframe></section>
  </main>
</body>
</html>
